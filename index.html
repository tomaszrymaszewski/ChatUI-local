<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Studio</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark" || ((!savedTheme || savedTheme === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <style>
      :root { color-scheme: light; --boot-bg: #fff; --boot-sidebar: #f5f5f5; --boot-line: #e8e8eb; --boot-shine: #e6e6e9; }
      :root.dark { color-scheme: dark; --boot-bg: #111; --boot-sidebar: #202020; --boot-line: #303030; --boot-shine: #303030; }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--boot-bg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
      .boot { display: flex; width: 100%; height: 100%; background: var(--boot-bg); }
      .boot-sidebar { display: flex; flex: 0 0 256px; min-height: 0; flex-direction: column; gap: 12px; padding: 40px 12px 14px; border-right: 1px solid var(--boot-line); background: var(--boot-sidebar); }
      .boot-modes { display: flex; height: 42px; gap: 4px; padding: 4px; border-radius: 12px; background: var(--boot-shine); }
      .boot-modes i { flex: 1; border-radius: 9px; }
      .boot-modes i:first-child { background: color-mix(in srgb, var(--boot-bg) 78%, transparent); }
      .boot-nav { display: flex; flex-direction: column; gap: 4px; }
      .boot-nav > i { height: 34px; border-radius: 8px; }
      .boot-recent { display: flex; flex: 1; flex-direction: column; gap: 14px; padding-top: 8px; }
      .boot-recent > i { height: 16px; border-radius: 5px; }
      .boot-main { display: flex; min-width: 0; min-height: 0; flex: 1; flex-direction: column; margin: 8px; overflow: hidden; border: 1px solid var(--boot-line); border-radius: 12px; background: var(--boot-bg); }
      .boot-toolbar { display: flex; height: 40px; flex: 0 0 40px; align-items: center; gap: 8px; padding: 0 14px; }
      .boot-toolbar i { width: 24px; height: 24px; border-radius: 7px; }
      .boot-center { display: flex; min-height: 0; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 12px 24px 40px; }
      .boot-title { width: min(400px, 60%); height: 34px; border-radius: 8px; }
      .boot-composer { width: min(680px, 84%); height: 112px; margin-top: 18px; border: 1px solid var(--boot-line); border-radius: 18px; }
      .boot-line { background: var(--boot-line); }
      .boot-skeleton { position: relative; overflow: hidden; background: var(--boot-shine); }
      .boot-skeleton::after { position: absolute; inset: 0; content: ""; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--boot-panel) 70%, transparent), transparent); animation: boot-shimmer 1.5s ease-in-out infinite; }
      @keyframes boot-shimmer { to { transform: translateX(100%); } }
      @media (max-width: 700px) { .boot-sidebar { flex-basis: 64px; padding-inline: 8px; } .boot-modes, .boot-recent { display: none; } .boot-nav > i { height: 30px; } .boot-title { width: 75%; } .boot-center { padding-inline: 12px; } .boot-composer { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { .boot-skeleton::after { animation: none; } }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" aria-label="Loading AI Studio">
        <aside class="boot-sidebar">
          <div class="boot-modes"><i class="boot-skeleton"></i><i class="boot-skeleton"></i></div>
          <div class="boot-nav"><i class="boot-skeleton"></i><i class="boot-skeleton"></i><i class="boot-skeleton"></i></div>
          <div class="boot-recent"><i class="boot-skeleton" style="width: 42%"></i><i class="boot-skeleton"></i><i class="boot-skeleton" style="width: 84%"></i><i class="boot-skeleton" style="width: 67%"></i><i class="boot-skeleton" style="width: 91%"></i><i class="boot-skeleton" style="width: 74%"></i><i class="boot-skeleton" style="width: 88%"></i></div>
        </aside>
        <main class="boot-main">
          <div class="boot-toolbar"><i class="boot-skeleton"></i><i class="boot-skeleton"></i><i class="boot-skeleton"></i></div>
          <div class="boot-center"><i class="boot-skeleton boot-title"></i><i class="boot-skeleton boot-composer"></i></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
