[package]
name = "aistudio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aistudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# Pinned so the app can install a process-wide rustls crypto provider at
# startup. tauri-plugin-updater pulls reqwest in with `rustls-no-provider`,
# which makes Tauri's webview client panic ("No rustls crypto provider is
# configured") unless a provider is installed first. `ring` is already in the
# dependency tree via Tauri's TLS stack, so this adds no new crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1.9"
sha2 = "0.10"
getrandom = "0.2"

