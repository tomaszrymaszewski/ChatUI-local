name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Fail loudly instead of shipping a build without account credentials —
      # an empty VITE_SUPABASE_URL silently produces an "accounts aren't
      # configured" app. GitHub passes missing secrets as empty strings.
      - name: Verify Supabase secrets are set
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          [ -z "$VITE_SUPABASE_URL" ] && { echo "::error::Repository secret VITE_SUPABASE_URL is not set (Settings → Secrets and variables → Actions)"; missing=1; }
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && { echo "::error::Repository secret VITE_SUPABASE_ANON_KEY is not set (Settings → Secrets and variables → Actions)"; missing=1; }
          exit $missing

      # Only expose Apple signing env vars when the secrets actually exist.
      # tauri-cli attempts a keychain import whenever APPLE_CERTIFICATE is set,
      # and GitHub passes missing secrets as empty strings — which breaks
      # unsigned builds. Once the Apple secrets are configured, this step
      # activates signing + notarization automatically.
      - name: Configure Apple signing (if secrets are set)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets detected; build will be signed and notarized."
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple signing secrets found; building unsigned (ad-hoc)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Supabase account + cloud sync credentials, baked into the frontend
          # by Vite at build time (the gitignored .env never reaches CI). Both
          # are publishable values by design — never put the secret key here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Studio ${{ github.ref_name }}"
          releaseBody: |
            ## Highlights

            - Agents everywhere: every chat-tab send runs the Deep Agents runtime, and a post-run suggestion system proposes skills, connectors, and modes as you go.
            - On-device OCR for scanned PDFs (macOS Vision) — PDFs, images, and documents work fully offline.
            - Browser sign-in for agent runs (Gmail, etc.), plus shell/PATH fixes so homebrew and nvm tools work in the packaged app.
            - One run per chat across windows and devices, with a live "Working for …" indicator when a run is already in flight.
            - Thinking controls list only the model's real effort levels and resolve to a sensible middle tier by default.
            - Fixed math rendering (full-size fractions and radicals), theme-aware SVG diagrams, and roomier message typography with guarded inline math (prices like "$5 and $10" stay literal).
            - Refined startup skeleton, chat transitions, composer sizing, and model selector.

            See the assets below to download and install this version.

            **macOS note:** if macOS says AI Studio is "damaged" (happens with unsigned builds),
            run `xattr -cr "/Applications/AI Studio.app"` in Terminal once, then open the app normally.

            **Windows note:** if SmartScreen says "Windows protected your PC", click
            **More info → Run anyway** to install.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub release
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release after all platform builds finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
